<style>
  body {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
    padding: 24px;
    margin: 0;
    background-color: #191a1e;
    color: #fff;
  }

  button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
    font-size: 12px;
    line-height: 16px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background-color 0.3s ease;
  }

  .title {
    font-size: 24px;
    font-weight: 700;
    margin: 0;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  .logo {
    width: 36px;
    height: 36px;
    border-radius: 8px;
  }

  .button-export {
    background: linear-gradient(90deg, #009a5f 0%, #008a27 100%);
    color: #f4f7fc;
  }

  .button-export:hover {
    background: linear-gradient(90deg, #008a27 0%, #009a5f 100%);
  }

  .button-export:disabled {
    cursor: wait;
    opacity: 0.7;
  }

  .buttons {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message {
    font-size: 14px;
    font-weight: 400;
    text-align: center;
  }

  .success {
    color: #009a5f;
  }

  .error {
    color: #ff0000;
  }

  .loading {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    background-color: rgba(0, 0, 0, 0.5);
    z-index: 1000;
    backdrop-filter: blur(10px);
    padding: 16px;
    font-size: 14px;
    font-weight: 400;
  }

  .loading.active {
    display: flex;
  }

  .checkbox-container {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    width: fit-content;
    transition: color 0.3s ease;
  }

  .checkbox-container:hover {
    color: #009a5f;
  }

  .checkbox-label {
    cursor: pointer;
  }

  .checkbox {
    width: 16px;
    height: 16px;
    cursor: pointer;
  }
</style>

<header class="header">
  <img src="" alt="" aria-hidden="true" class="logo" />
  <h1 class="title">Export Text Styles to CSS mixins</h1>
</header>
<section class="buttons">

  <button id="export" class="button-export">
    Export
  </button>

  <div class="checkbox-container">
    <input type="checkbox" id="checkbox-use-variables" class="checkbox" checked />
    <label for="checkbox-use-variables" class="checkbox-label">Use variables for properties (if
      available)</label>
  </div>
</section>
<div class="messages">
  <div id="message" class="message success" role="status" aria-live="polite"></div>
  <div id="error" class="message error" role="alert" aria-live="assertive"></div>
</div>
<div id="loading" class="loading" role="status" aria-live="polite" aria-hidden="true">
  <div class="loading-text">Loading...</div>
</div>
